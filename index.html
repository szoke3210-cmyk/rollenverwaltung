<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rollenverwaltung</title>
<style>
body{font-family:Arial;margin:0;background:#f3f4f6;color:#111827}
header{background:#0f172a;color:white;padding:16px;font-size:22px;font-weight:bold}
.container{padding:16px;max-width:1100px;margin:auto}
.box{background:white;padding:16px;border-radius:12px;margin-bottom:16px;box-shadow:0 1px 4px #ccc}
input,textarea,select,button{width:100%;padding:12px;margin:6px 0;font-size:16px;box-sizing:border-box}
button{background:#2563eb;color:white;border:0;border-radius:8px;cursor:pointer;font-weight:bold}
button.green{background:#16a34a}
button.orange{background:#f59e0b;color:#111}
button.red{background:#dc2626}
table{width:100%;border-collapse:collapse;background:white}
th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}
tr{cursor:pointer}
.status{padding:4px 8px;border-radius:8px;font-weight:bold;display:inline-block}
.lager{background:#dcfce7;color:#166534}
.reparatur{background:#fee2e2;color:#991b1b}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.big{font-size:28px;font-weight:bold}
canvas{margin-top:10px;max-width:100%}
</style>
</head>
<body>

<header onclick="location.href='index.html'" style="cursor:pointer">
Rollenverwaltung
</header>
<div class="container">
<div id="app">Laden...</div>
</div>

<script>
const SUPABASE_URL = "https://fkjpuhijmbrxazowbbms.supabase.co";
const SUPABASE_KEY = "sb_publishable_4QHY2mfUoUmHxfS7dU8fGQ_Deh6bDbu";

const headers = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json",
  "Prefer": "return=representation"
};

const params = new URLSearchParams(window.location.search);
const kennung = params.get("id");
const typFilter = params.get("typ");

async function api(path, options = {}) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, { headers, ...options });
  if (!res.ok) {
    alert("Fehler: " + await res.text());
    return [];
  }
  return await res.json();
}

function statusBadge(status) {
  if (status === "Electrotherm") return `<span class="status reparatur">Electrotherm</span>`;
  return `<span class="status lager">Im Lager</span>`;
}

function qrUrl(kennung) {
  return location.origin + location.pathname + "?id=" + encodeURIComponent(kennung);
}

async function showList() {
  let query = "rollen?select=*&order=typ.asc,kennung.asc";
  if (typFilter) query = "rollen?typ=eq." + encodeURIComponent(typFilter) + "&select=*&order=kennung.asc";

  const rollen = await api(query);

  let alle = await api("rollen?select=*");
  let typen = {};

  alle.forEach(r => {
    if (!typen[r.typ]) typen[r.typ] = { count:0, meter:0, lager:0, electro:0 };
    typen[r.typ].count++;
    typen[r.typ].meter += Number(r.aktuelle_laenge);
    if (r.status === "Electrotherm") typen[r.typ].electro++;
    else typen[r.typ].lager++;
  });

  let typOptions = Object.keys(typen).sort().map(t => `<option value="${t}">${t}</option>`).join("");

  let html = `
  <div class="box">
    <h2>${typFilter ? "Typ: " + typFilter : "Übersicht nach Typ"}</h2>
    ${typFilter ? `<button onclick="location.href='index.html'">Alle Typen anzeigen</button>` : ""}
    <div class="grid">
  `;

  Object.keys(typen).sort().forEach(t => {
    html += `
    <div class="box" onclick="location.href='?typ=${encodeURIComponent(t)}'">
      <h3>${t}</h3>
      <div class="big">${typen[t].meter} m</div>
      <p>${typen[t].count} Rollen</p>
      <p>Im Lager: ${typen[t].lager}</p>
      <p>Electrotherm: ${typen[t].electro}</p>
    </div>`;
  });

html += `
    </div>
  </div>
`;

if (!typFilter) {
  html += `
  <div class="box">
    <h2>Neue Rolle hinzufügen</h2>
    <input id="newKennung" placeholder="Kennung z.B. 2-ABC123">

    <label>Typ auswählen</label>
    <select id="typSelect" onchange="typWechsel()">
      <option value="">Typ auswählen...</option>
      ${typOptions}
      <option value="__neu">+ Neuer Typ</option>
    </select>

    <input id="newTyp" placeholder="Neuer Typ z.B. ABC123" style="display:none">
    <input id="newLaenge" type="number" step="0.01" placeholder="Länge in Meter">
    <textarea id="newBemerkung" placeholder="Bemerkung"></textarea>
    <button class="green" onclick="neueRolle()">Neue Rolle speichern</button>
  </div>
  `;
}

html += `
  <div class="box">
    <h2>${typFilter ? "Rollen von Typ " + typFilter : "Alle Rollen"}</h2>
    <input id="search" placeholder="Suchen..." onkeyup="filterTable()">
  </div>

  <table id="rollenTable">
    <tr><th>Kennung</th><th>Bemerkung</th><th>Typ</th><th>Länge</th><th>Verlust</th><th>Status</th><th>Auftrag</th></tr>
`;

  rollen.forEach(r => {
    const verlust = Number(r.urspruengliche_laenge) - Number(r.aktuelle_laenge);
    html += `
    <tr onclick="location.href='?id=${encodeURIComponent(r.kennung)}'">
<td>${r.kennung}</td>
<td>${r.bemerkung || "-"}</td>
<td>${r.typ}</td>
<td>${r.aktuelle_laenge} m</td>
<td>${verlust} m</td>
<td>${statusBadge(r.status)}</td>
<td>${r.auftrag || "-"}</td>
</tr>`;
  });

  html += `</table>`;
  document.getElementById("app").innerHTML = html;

}
function typWechsel() {
  const select = document.getElementById("typSelect");
  const input = document.getElementById("newTyp");
  input.style.display = select.value === "__neu" ? "block" : "none";
}

function filterTable() {
  const input = document.getElementById("search").value.toLowerCase();
  document.querySelectorAll("#rollenTable tr").forEach((row, i) => {
    if (i === 0) return;
    row.style.display = row.innerText.toLowerCase().includes(input) ? "" : "none";
  });
}

async function neueRolle() {
  const kennung = document.getElementById("newKennung").value.trim();
  const selectTyp = document.getElementById("typSelect").value;
  const neuerTyp = document.getElementById("newTyp").value.trim();
  const typ = selectTyp === "__neu" ? neuerTyp : selectTyp;
  const laenge = document.getElementById("newLaenge").value;
  const bemerkung = document.getElementById("newBemerkung").value;

  if (!kennung || !typ || !laenge) {
    alert("Kennung, Typ und Länge ausfüllen.");
    return;
  }

  const data = await api("rollen", {
    method: "POST",
    body: JSON.stringify({
      kennung, typ,
      urspruengliche_laenge: laenge,
      aktuelle_laenge: laenge,
      status: "Im Lager",
      bemerkung
    })
  });

  if (data.length) {
    await api("historie", {
      method: "POST",
      body: JSON.stringify({
        rollen_id: data[0].id,
        aktion: "Neu angelegt",
        laenge,
        bemerkung
      })
    });
  }

  alert("Rolle gespeichert");
  location.reload();
}

async function showDetail() {
  const daten = await api("rollen?kennung=eq." + encodeURIComponent(kennung) + "&select=*");
  if (!daten.length) {
    document.getElementById("app").innerHTML = `<div class="box"><h2>Rolle nicht gefunden</h2><button onclick="location.href='index.html'">Zur Übersicht</button></div>`;
    return;
  }

  const r = daten[0];
  const verlust = Number(r.urspruengliche_laenge) - Number(r.aktuelle_laenge);
  const historie = await api("historie?rollen_id=eq." + r.id + "&select=*&order=datum.desc");

  let html = `
  <div class="box">
    <h2>${r.kennung}</h2>
    <p><b>Typ:</b> ${r.typ}</p>
    <p><b>Aktuelle Länge:</b> ${r.aktuelle_laenge} m</p>
    <p><b>Ursprüngliche Länge:</b> ${r.urspruengliche_laenge} m</p>
    <p><b>Gesamtverlust:</b> ${verlust} m</p>
    <p><b>Status:</b> ${statusBadge(r.status)}</p>
    <p><b>Bemerkung:</b> ${r.bemerkung || "-"}</p>
  </div>
  
html += `
  <div class="box">
    <h3>QR-Code</h3>

<img
  src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(qrUrl(r.kennung))}"
  style="max-width:300px;width:100%;"
>

<br><br>

<a
  href="https://api.qrserver.com/v1/create-qr-code/?size=1000x1000&data=${encodeURIComponent(qrUrl(r.kennung))}"
  download="QR_${r.kennung}.png"
>
<button type="button">QR-Code herunterladen</button>
</a>

</div>

html += `
<div class="box">
  <h3>Rolle ändern</h3>
  <p><b>Aktuelle Länge:</b> ${r.aktuelle_laenge} m</p>

  <label>Verbrauch / Verlust in Meter</label>
  <input id="verbrauch" type="number" step="0.01" placeholder="z.B. 5">

  <label>Status</label>
  <select id="status">
    <option ${r.status=="Im Lager" ? "selected" : ""}>Im Lager</option>
    <option ${r.status=="Electrotherm" ? "selected" : ""}>Electrotherm</option>
  </select>

  <label>Auftrag (Kunde)</label>
  <textarea id="auftrag" placeholder="Kunde eingeben, wenn zu Electrotherm gesendet wird">${r.auftrag || ""}</textarea>

  <button onclick="speichern(${r.id})">Speichern</button>
  <button class="orange" onclick="zuElectrotherm(${r.id})">Zu Electrotherm senden</button>
  <button class="green" onclick="zurueck(${r.id})">Als zurückgekommen markieren</button>
  <button class="red" onclick="deleteRolle(${r.id})">Rolle löschen</button>
</div>

<div class="box"><h3>Historie</h3>
`;

if (!historie.length) html += `<p>Noch keine Historie.</p>`;
  historie.forEach(h => {
    html += `<p><b>${new Date(h.datum).toLocaleString("de-DE")}</b><br>${h.aktion} — ${h.laenge} m<br>${h.bemerkung || ""}</p><hr>`;
  });

  html += `</div><button onclick="location.href='index.html'">Zur Übersicht</button>`;
document.getElementById("app").innerHTML = html;
}

async function speichern(id) {
  const daten = await api("rollen?id=eq." + id + "&select=*");
  if (!daten.length) return;

  const r = daten[0];

  const verbrauchInput = document.getElementById("verbrauch");
  const verbrauch = verbrauchInput ? Number(verbrauchInput.value) : 0;

  const status = document.getElementById("status").value;
const auftrag = document.getElementById("auftrag").value;
const bemerkung = r.bemerkung || "";

  let neueLaenge = Number(r.aktuelle_laenge);

  if (verbrauch > 0) {
    neueLaenge = neueLaenge - verbrauch;
  }

  if (status === "Electrotherm" && !auftrag.trim()) {
  alert("Bitte Auftrag / Kunde eingeben.");
  return;
}

  if (status === "Im Lager" && r.status === "Electrotherm" && (!verbrauch || verbrauch <= 0)) {
    alert("Bitte eintragen, wie viele Meter verbraucht wurden.");
    return;
  }

  const nichtsGeaendert =
    Number(r.aktuelle_laenge) === Number(neueLaenge) &&
    r.status === status &&
    (r.auftrag || "") === auftrag;

if (nichtsGeaendert) {
    alert("Keine Änderung.");
    return;
}

await api("rollen?id=eq." + id, {
    method: "PATCH",
    body: JSON.stringify({
        aktuelle_laenge: neueLaenge,
        status: status,
        auftrag: status === "Electrotherm" ? auftrag : "",
        bemerkung: bemerkung
    })
});
  
  let aktion = "Geändert";

if (r.status !== status && status === "Electrotherm") {
  aktion = "Zu Electrotherm gesendet";
}

if (r.status !== status && status === "Im Lager") {
  aktion = "Von Electrotherm zurück";
}

if (auftrag && status === "Electrotherm") {
  aktion += " | Auftrag: " + auftrag;
}

if (verbrauch > 0) {
  aktion += " | Verbrauch: " + verbrauch + " m";
}

await api("historie", {
  method: "POST",
  body: JSON.stringify({
    rollen_id: id,
    aktion: aktion,
    laenge: neueLaenge,
    bemerkung: auftrag
  })
});
  
  alert("Gespeichert");
  location.reload();
}

async function zuElectrotherm(id) {
  document.getElementById("status").value = "Electrotherm";
  await speichern(id);
}

async function zurueck(id) {
  document.getElementById("status").value = "Im Lager";
  await speichern(id);
}

async function deleteRolle(id) {
  if (!confirm("Diese Rolle wirklich löschen? Die Historie wird auch gelöscht.")) return;

  await api("historie?rollen_id=eq." + id, { method: "DELETE" });
  await api("rollen?id=eq." + id, { method: "DELETE" });

  alert("Rolle gelöscht");
  location.href = "index.html";
}

if (kennung) showDetail();
else showList();
</script>
</body>
</html>
