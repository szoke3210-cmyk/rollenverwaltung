const headers = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json",
  "Prefer": "return=representation"
};

const params = new URLSearchParams(window.location.search);
const kennung = params.get("id");
const typFilter = params.get("typ");
const page = params.get("page");
  
async function api(path, options = {}) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, { headers, ...options });
  if (!res.ok) {
    alert("Fehler: " + await res.text());
    return [];
  }
  return await res.json();
}

function statusBadge(status) {
  if (status === "Electrotherm") return `<span class="status reparatur">Electrotherm</span>`;
  return `<span class="status lager">Im Lager</span>`;
}

function qrUrl(kennung) {
  return location.origin + location.pathname + "?id=" + encodeURIComponent(kennung);
}

function typWechsel() {

function filterTable() {
  const input = document.getElementById("search").value.toLowerCase();
  document.querySelectorAll("#rollenTable tr").forEach((row, i) => {
    if (i === 0) return;
    row.style.display = row.innerText.toLowerCase().includes(input) ? "" : "none";
  });
}
  
function kundeWechsel() {

async function neueRolle() {
  const kennung = document.getElementById("newKennung").value.trim();
  const selectTyp = document.getElementById("typSelect").value;
  const neuerTyp = document.getElementById("newTyp").value.trim();
  const typ = selectTyp === "__neu" ? neuerTyp : selectTyp;
  const laenge = document.getElementById("newLaenge").value;
  const bemerkung = document.getElementById("newBemerkung").value;

  if (!kennung || !typ || !laenge) {
    alert("Kennung, Typ und Länge ausfüllen.");
    return;
  }

  const data = await api("rollen", {
    method: "POST",
    body: JSON.stringify({
      kennung, typ,
      urspruengliche_laenge: laenge,
      aktuelle_laenge: laenge,
      status: "Im Lager",
      bemerkung
    })
  });

  if (data.length) {
    await api("historie", {
      method: "POST",
      body: JSON.stringify({
        rollen_id: data[0].id,
        aktion: "Neu angelegt",
        laenge,
        bemerkung
      })
    });
  }

  alert("Rolle gespeichert");
  location.reload();
}

async function loadTypEditor() {
  const typ = document.getElementById("typSelect").value;

  if (!typ) {
    document.getElementById("typEditor").innerHTML = "";
    return;
  }

  const rollen = await api("rollen?typ=eq." + encodeURIComponent(typ) + "&select=*");

  const meter = rollen.reduce((sum, r) => sum + Number(r.aktuelle_laenge), 0);

  document.getElementById("typEditor").innerHTML = `
    <div class="box">
      <h3>${typ}</h3>
      <p>Rollen: ${rollen.length}</p>
      <p>Meter: ${meter.toFixed(2)} m</p>

      <label>Neuer Typname</label>
      <input id="newTypName" value="${typ}">

        Typ löschen

}
  

async function renameTyp(altTyp) {
  const neuerTyp = document.getElementById("newTypName").value.trim();

  if (!neuerTyp) {
    alert("Neuen Typ eingeben.");
    return;
  }

  await api("rollen?typ=eq." + encodeURIComponent(altTyp), {
    method: "PATCH",
    body: JSON.stringify({
      typ: neuerTyp
    })
  });

  alert("Typ geändert");
  location.reload();
}

async function deleteTyp(typ) {
  if (!confirm("Diesen Typ wirklich löschen? Alle Rollen dieses Typs werden gelöscht.")) return;

  const rollen = await api("rollen?typ=eq." + encodeURIComponent(typ) + "&select=id");

  for (const r of rollen) {
    await api("historie?rollen_id=eq." + r.id, { method: "DELETE" });
    await api("rollen?id=eq." + r.id, { method: "DELETE" });
  }

  alert("Typ und alle Rollen gelöscht");
  location.href = "index.html";
}

  function downloadStatistikCSV() {
  const statistik = window.statistikData || {};
  let csv = "Monat;Typ;Kunde;Verbrauch\n";

  Object.keys(statistik).forEach(monat => {
    Object.keys(statistik[monat]).forEach(typ => {
      Object.keys(statistik[monat][typ].kunden).forEach(kunde => {
        csv +=
          monat + ";" +
          typ + ";" +
          kunde + ";" +
          statistik[monat][typ].kunden[kunde] +
          "\n";
      });
    });
  });

  const blob = new Blob([csv], {
    type: "text/csv;charset=utf-8;"
  });

  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "Statistik.csv";
  link.click();
}

async function speichern(id) {
  const daten = await api("rollen?id=eq." + id + "&select=*");
  if (!daten.length) return;

  const r = daten[0];

  const verbrauchInput = document.getElementById("verbrauch");
  const verbrauchText = verbrauchInput ? verbrauchInput.value.trim() : "";
const verbrauch = verbrauchText === "" ? null : Number(verbrauchText);
  
  let status = window.forceStatus || r.status;
  
  const auftragSelect = document.getElementById("auftragSelect").value;
  const auftragNeu = document.getElementById("auftragNeu").value.trim();

  const auftrag =
    auftragSelect === "__neu"
      ? auftragNeu
      : auftragSelect;

  let neueLaenge = Number(r.aktuelle_laenge);

  if (verbrauch > 0) {
    neueLaenge = neueLaenge - verbrauch;
  }

  if (neueLaenge < 0) {
    alert("Verbrauch größer als die aktuelle Länge!");
    return;
  }

  if (status === "Electrotherm" && !auftrag.trim()) {
    alert("Bitte Auftrag / Kunde eingeben.");
    return;
  }
  
  if (r.status === "Electrotherm" && status === "Electrotherm" && (r.auftrag || "") !== auftrag) {
  alert("Diese Rolle ist bereits bei Electrotherm. Erst zurück ins Lager buchen.");
  return;
}

  if (status === "Im Lager" && r.status === "Electrotherm" && verbrauchText === "") {
  alert("Bitte Verbrauch eintragen. Wenn nichts verbraucht wurde, 0 eingeben.");
  return;
}

if (verbrauch !== null && verbrauch < 0) {
  alert("Verbrauch darf nicht negativ sein.");
  return;
}

  if (auftragSelect === "__neu" && auftragNeu) {
    await api("kunden", {
      method: "POST",
      body: JSON.stringify({
        name: auftragNeu
      })
    });
  }

  const nichtsGeaendert =
    Number(r.aktuelle_laenge) === Number(neueLaenge) &&
    r.status === status &&
    (r.auftrag || "") === auftrag;

  if (nichtsGeaendert) {
    alert("Keine Änderung.");
    return;
  }

  await api("rollen?id=eq." + id, {
    method: "PATCH",
    body: JSON.stringify({
      aktuelle_laenge: neueLaenge,
      status: status,
      auftrag: status === "Electrotherm" ? auftrag : "",
      bemerkung: r.bemerkung || ""
    })
  });

  let aktion = "Geändert";

  if (r.status !== status && status === "Electrotherm") {
    aktion = "Zu Electrotherm gesendet";
  }

  if (r.status !== status && status === "Im Lager") {
    aktion = "Von Electrotherm zurück";
  }

  if (auftrag && status === "Electrotherm") {
    aktion += " | Auftrag: " + auftrag;
  }

  if (verbrauch > 0) {
    aktion += " | Verbrauch: " + verbrauch + " m";
  }

  await api("historie", {
    method: "POST",
    body: JSON.stringify({
      rollen_id: id,
      aktion: aktion,
      laenge: neueLaenge,
      bemerkung: auftrag,
      verbrauch: verbrauch,
      typ: r.typ,
      auftrag: auftrag
    })
  });

  alert("Gespeichert");
  location.reload();
}

async function zuElectrotherm(id) {
  window.forceStatus = "Electrotherm";
  await speichern(id);
}

async function zurueck(id) {
  window.forceStatus = "Im Lager";
  await speichern(id);
}

}
  
async function deleteRolle(id) {
  if (!confirm("Diese Rolle wirklich löschen? Die Historie wird auch gelöscht.")) return;

  await api("historie?rollen_id=eq." + id, { method: "DELETE" });
  await api("rollen?id=eq." + id, { method: "DELETE" });

  alert("Rolle gelöscht");
  location.href = "index.html";
}
  
  async function showAuswahl() {
  const rollen = await api("rollen?select=*&order=typ.asc,kennung.asc");

  let html = `
    <div class="box">
      <h2>Rolle bearbeiten</h2>

      <select id="rolleSelect" onchange="loadRolleEditor()">
        <option value="">Rolle auswählen...</option>
  `;

  rollen.forEach(r => {
    html += `
      <option value="${r.id}">
        ${r.kennung} - ${r.typ} - ${r.aktuelle_laenge} m - ${r.status}
      </option>
    `;
  });

  html += `
      </select>

      <div id="rolleEditor"></div>

      <button onclick="location.href='index.html'">
        Zur Übersicht
      </button>
    </div>
  `;

  document.getElementById("app").innerHTML = html;
}

function showScanner() {
  document.getElementById("app").innerHTML = `
    <div class="box">
      <h2>QR-Code scannen</h2>
      <div id="reader" style="width:100%; max-width:400px;"></div>
      <button onclick="location.href='index.html'">Zur Übersicht</button>
    </div>
  `;

  const scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },
    {
      fps: 10,
      qrbox: 250
    },
    decodedText => {
      scanner.stop();

      try {
        const url = new URL(decodedText);
        const id = url.searchParams.get("id");

        if (id) {
          location.href = "?id=" + encodeURIComponent(id);
        } else {
          alert("Kein Rollen-ID im QR-Code gefunden.");
        }
      } catch (e) {
        location.href = "?id=" + encodeURIComponent(decodedText);
      }
    }
  );
}
  async function loadRolleEditor() {
  const id = document.getElementById("rolleSelect").value;

  if (!id) {
    document.getElementById("rolleEditor").innerHTML = "";
    return;
  }

  const daten = await api("rollen?id=eq." + id + "&select=*");
  if (!daten.length) return;

  const r = daten[0];

  document.getElementById("rolleEditor").innerHTML = `
    <div class="box">
      <h3>${r.kennung}</h3>

      <label>Kennung</label>
      <input id="editKennung" value="${r.kennung}">

      <label>Typ</label>
      <input id="editTyp" value="${r.typ}">

      <label>Ursprüngliche Länge</label>
      <input id="editUrsprung" type="number" step="0.01" value="${r.urspruengliche_laenge}">

      <label>Aktuelle Länge</label>
      <input id="editAktuell" type="number" step="0.01" value="${r.aktuelle_laenge}">

      <label>Bemerkung</label>
      <textarea id="editBemerkung">${r.bemerkung || ""}</textarea>

      <label>Auftrag</label>
      <input id="editAuftrag" value="${r.auftrag || ""}">

      <button onclick="saveRolleEditor(${r.id})">
        Änderungen speichern
      </button>
    </div>
  `;
}

async function saveRolleEditor(id) {
  const kennung = document.getElementById("editKennung").value.trim();
  const typ = document.getElementById("editTyp").value.trim();
  const ursprung = Number(document.getElementById("editUrsprung").value);
  const aktuell = Number(document.getElementById("editAktuell").value);
  const status = document.getElementById("editStatus").value;
  const bemerkung = document.getElementById("editBemerkung").value;
  const auftrag = document.getElementById("editAuftrag").value;

  if (!kennung || !typ) {
    alert("Kennung und Typ ausfüllen.");
    return;
  }

  if (ursprung < 0 || aktuell < 0) {
    alert("Länge darf nicht negativ sein.");
    return;
  }

  await api("rollen?id=eq." + id, {
    method: "PATCH",
    body: JSON.stringify({
      kennung: kennung,
      typ: typ,
      urspruengliche_laenge: ursprung,
      aktuelle_laenge: aktuell,
      status: status,
      bemerkung: bemerkung,
      auftrag: auftrag
    })
  });

  alert("Rolle geändert");
  location.reload();
}
